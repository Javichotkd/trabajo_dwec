<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="theme-color" content="#f3f6fb">
 <title>Retos de JavaScript | DWEC</title>
 <style>
  :root {
   color-scheme: light;
   font-family: "Segoe UI", Arial, sans-serif;
   color: #19243a;
   background: #f3f6fb;
  }

  * {
   box-sizing: border-box;
  }

  body {
   min-height: 100vh;
   margin: 0;
   display: grid;
   place-items: center;
   padding: 32px 18px;
   background:
    radial-gradient(ellipse at 10% 10%, #dce8ff 0, transparent 42%),
    radial-gradient(ellipse at 90% 90%, #e6e0ff 0, transparent 38%),
    #f3f6fb;
  }

  main {
    width: min(100%, 1200px);
    display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(340px, 0.9fr);
    gap: 36px;
   padding: clamp(26px, 6vw, 52px);
   border: 1px solid #e5eaf3;
   border-radius: 24px;
   background: rgb(255 255 255 / 92%);
   box-shadow: 0 24px 70px rgb(36 57 94 / 12%);
  }

  header {
   grid-column: 1 / -1;
  }

  .eyebrow {
   margin: 0 0 10px;
   color: #526ee0;
   font-size: 0.78rem;
   font-weight: 700;
   letter-spacing: 0.14em;
   text-transform: uppercase;
  }

  h1 {
   margin: 0;
   font-size: clamp(2rem, 6vw, 3rem);
   letter-spacing: -0.045em;
  }

  .intro {
   margin: 12px 0 30px;
   color: #66738b;
   font-size: 1.05rem;
   line-height: 1.6;
  }

  .retos {
   display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
   gap: 14px;
  }

  button {
    grid-column: auto;
   height: 96px;
   display: flex;
   align-items: center;
   gap: 14px;
   padding: 16px;
   border: 2px solid #c7d1e2;
   border-radius: 16px;
   background: #fff;
   color: inherit;
   font: inherit;
   text-align: left;
   cursor: pointer;
   transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  button:hover {
   transform: translateY(-2px);
   border-color: #7188d8;
   box-shadow: 0 10px 24px rgb(53 78 145 / 10%);
  }

  button:focus-visible {
   outline: 3px solid #7188ff;
   outline-offset: 3px;
  }

  @media (max-width: 700px) {
   .retos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
   }

   button {
    grid-column: span 1;
   }
  }

  .numero {
   width: 42px;
   height: 42px;
   flex: 0 0 42px;
   display: grid;
   place-items: center;
   border-radius: 12px;
   background: #eef1ff;
   color: #465fd0;
   font-weight: 700;
  }

  .texto {
   display: grid;
   gap: 4px;
   min-width: 0;
  }

  .nombre {
   overflow: hidden;
   font-weight: 700;
   text-overflow: ellipsis;
   white-space: nowrap;
  }

  .detalle {
   overflow: hidden;
   color: #758198;
   font-size: 0.86rem;
   text-overflow: ellipsis;
   white-space: nowrap;
  }

  .salida {
   display: flex;
   grid-column: 2;
   grid-row: 2;
   align-self: stretch;
  }

  .salida h2 {
   margin: 0 0 10px;
   font-size: 1rem;
  }

  #pantalla-consola {
    min-height: 250px;
    flex: 1;
   overflow-y: auto;
   padding: 15px;
   border: 2px solid #333;
   border-radius: 6px;
   background: #1a1a1a;
   box-shadow: inset 0 0 10px #000;
   color: #00ff00;
   font-family: monospace;
   line-height: 1.5;
   white-space: pre-wrap;
  }

  @media (max-width: 700px) {
   main {
    grid-template-columns: 1fr;
   }

   .retos,
   .salida {
    grid-column: 1;
    grid-row: auto;
   }
  }

  @media (prefers-reduced-motion: reduce) {
   *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
   }
  }
 </style>
 <script src="./js/codigo.js"></script>
</head>
<body>
 <main>
  <header>
   <p class="eyebrow">DWEC · Práctica interactiva</p>
   <h1>Retos de JavaScript</h1>
   <p class="intro">Elige un reto para ejecutar los ejemplos. Los resultados aparecen en la consola del navegador.</p>
  </header>
  <section class="retos" aria-label="Retos disponibles">
   <button id="miBoton1" type="button">
    <span class="numero">1</span>
    <span class="texto"><span class="nombre">Aritmética</span><span class="detalle">Operaciones y asignación</span></span>
   </button>
   <button id="miBoton2" type="button">
    <span class="numero">2</span>
    <span class="texto"><span class="nombre">Incrementos</span><span class="detalle">Pre y postincremento</span></span>
   </button>
   <button id="miBoton3" type="button">
    <span class="numero">3</span>
    <span class="texto"><span class="nombre">Comparaciones</span><span class="detalle">Igualdad y operadores</span></span>
   </button>
   <button id="miBoton4" type="button">
    <span class="numero">4</span>
    <span class="texto"><span class="nombre">Lógica</span><span class="detalle">Condiciones de acceso</span></span>
   </button>
   <button id="miBoton5" type="button">
    <span class="numero">5</span>
    <span class="texto"><span class="nombre">Tipos de datos</span><span class="detalle">El operador typeof</span></span>
   </button>
   <button id="miBoton6" type="button">
    <span class="numero">6</span>
    <span class="texto"><span class="nombre">Precio de entrada</span><span class="detalle">Descuento para socios</span></span>
   </button>
   <button id="miBoton7" type="button">
    <span class="numero">7</span>
    <span class="texto"><span class="nombre">Reto extra</span><span class="detalle">Reto extra</span></span>
   </button>
  </section>
  <section class="salida" aria-labelledby="titulo-consola">
   <div id="pantalla-consola" role="log" aria-live="polite" aria-label="Resultados de los retos"></div>
  </section>
 </main>
</body>
</html>
