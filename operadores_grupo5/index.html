<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta name="theme-color" content="#f3f6fb">
 <title>Retos de JavaScript | DWEC</title>
 <style>
  :root {
   color-scheme: light;
   font-family: "Segoe UI", Arial, sans-serif;
   color: #19243a;
   background: #f3f6fb;
  }

  * {
   box-sizing: border-box;
  }

  body {
   min-height: 100vh;
   margin: 0;
   display: grid;
   place-items: center;
   padding: 32px 18px;
   background:
    radial-gradient(ellipse at 10% 10%, #dce8ff 0, transparent 42%),
    radial-gradient(ellipse at 90% 90%, #e6e0ff 0, transparent 38%),
    #f3f6fb;
  }

  main {
   width: min(100%, 760px);
   padding: clamp(26px, 6vw, 52px);
   border: 1px solid #e5eaf3;
   border-radius: 24px;
   background: rgb(255 255 255 / 92%);
   box-shadow: 0 24px 70px rgb(36 57 94 / 12%);
  }

  .eyebrow {
   margin: 0 0 10px;
   color: #526ee0;
   font-size: 0.78rem;
   font-weight: 700;
   letter-spacing: 0.14em;
   text-transform: uppercase;
  }

  h1 {
   margin: 0;
   font-size: clamp(2rem, 6vw, 3rem);
   letter-spacing: -0.045em;
  }

  .intro {
   margin: 12px 0 30px;
   color: #66738b;
   font-size: 1.05rem;
   line-height: 1.6;
  }

  .retos {
   display: grid;
   grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr));
   gap: 14px;
  }

  button {
   min-height: 88px;
   display: flex;
   align-items: center;
   gap: 14px;
   padding: 16px;
   border: 1px solid #e3e9f4;
   border-radius: 16px;
   background: #fff;
   color: inherit;
   font: inherit;
   text-align: left;
   cursor: pointer;
   transition: border-color 160ms ease, box-shadow 160ms ease, transform 160ms ease;
  }

  button:hover {
   transform: translateY(-2px);
   border-color: #b8c6ff;
   box-shadow: 0 10px 24px rgb(53 78 145 / 10%);
  }

  button:focus-visible {
   outline: 3px solid #7188ff;
   outline-offset: 3px;
  }

  .numero {
   width: 42px;
   height: 42px;
   flex: 0 0 42px;
   display: grid;
   place-items: center;
   border-radius: 12px;
   background: #eef1ff;
   color: #465fd0;
   font-weight: 700;
  }

  .texto {
   display: grid;
   gap: 4px;
  }

  .nombre {
   font-weight: 700;
  }

  .detalle {
   color: #758198;
   font-size: 0.86rem;
  }

  @media (prefers-reduced-motion: reduce) {
   *, *::before, *::after {
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
   }
  }
 </style>
 <script src="./js/codigo.js"></script>
</head>
<body>
 <main>
  <header>
   <p class="eyebrow">DWEC · Práctica interactiva</p>
   <h1>Retos de JavaScript</h1>
   <p class="intro">Elige un reto para ejecutar los ejemplos. Los resultados aparecen en la consola del navegador.</p>
  </header>
  <section class="retos" aria-label="Retos disponibles">
   <button id="miBoton1" type="button">
    <span class="numero">01</span>
    <span class="texto"><span class="nombre">Aritmética</span><span class="detalle">Operaciones y asignación</span></span>
   </button>
   <button id="miBoton2" type="button">
    <span class="numero">02</span>
    <span class="texto"><span class="nombre">Incrementos</span><span class="detalle">Pre y postincremento</span></span>
   </button>
   <button id="miBoton3" type="button">
    <span class="numero">03</span>
    <span class="texto"><span class="nombre">Comparaciones</span><span class="detalle">Igualdad y operadores</span></span>
   </button>
   <button id="miBoton4" type="button">
    <span class="numero">04</span>
    <span class="texto"><span class="nombre">Lógica</span><span class="detalle">Condiciones de acceso</span></span>
   </button>
   <button id="miBoton5" type="button">
    <span class="numero">05</span>
    <span class="texto"><span class="nombre">Tipos de datos</span><span class="detalle">El operador typeof</span></span>
   </button>
   <button id="miBoton6" type="button">
    <span class="numero">06</span>
    <span class="texto"><span class="nombre">Reto 6</span><span class="detalle">Próximamente</span></span>
   </button>
  </section>
 </main>
</body>
</html>
